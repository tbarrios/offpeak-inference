[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offpeak"
version = "0.1.0"
description = "Temporal inference cost arbitrage for AI agents: defer non-urgent LLM work to cheap-energy hours, track savings, and learn user flexibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Barrios" }]
keywords = ["llm", "inference", "agents", "mcp", "cost", "scheduling", "energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
offpeak = "offpeak.cli:main"

[project.urls]
Homepage = "https://github.com/tbarrios/offpeak-inference"
Issues = "https://github.com/tbarrios/offpeak-inference/issues"

[tool.setuptools.packages.find]
include = ["offpeak*"]

